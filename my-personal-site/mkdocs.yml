site_name: Малика Агадилова
site_description: Бизнес-анализ, технологии и управление проектами. Персональный сайт Малики Агадиловой.
site_author: Малика Агадилова
site_url: https://avolidaga.github.io/devops-lab-agadilova/

theme:
  name: material
  language: ru
  font: false
  logo: images/logo.svg
  favicon: images/logo.svg

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему

    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

nav:
  - Главная: index.md
  - О себе: about.md
  - Проекты: projects.md
  - Резюме: resume.md
  - Достижения: achievements.md
  - Контакты: contacts.md

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/avolidaga
      name: Telegram

    - icon: material/email
      link: mailto:malika.agadilova@mail.ru
      name: Электронная почта

    - icon: material/phone
      link: tel:+79817772823
      name: Телефон

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 Малика Агадилова